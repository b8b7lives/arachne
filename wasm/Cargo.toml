[package]
name = "arachne-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "Arachne WASM boundary (thin wrapper over arachne-core)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arachne-core = { path = "../core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
