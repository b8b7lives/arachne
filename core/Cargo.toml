[package]
name = "arachne-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "Arachne mapart compute core (native + wasm32)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
crate-type = ["rlib", "cdylib"]

[dev-dependencies]
flate2 = "1.1.9"
